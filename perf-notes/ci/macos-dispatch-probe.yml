# Does Apple clang merge the computed-goto dispatch jumps (the LLVM 19
# tail-duplication regression, gh-129987)?  For every Xcode installed on each
# macOS runner image, compile Python/ceval.c and count the indirect branches in
# _PyEval_EvalFrameDefault, with and without -mllvm -tail-dup-pred-size=1000.
# One indirect branch per opcode handler (~230-360) is healthy; a handful means
# the dispatch sites were merged.
name: macos-dispatch-probe

on:
  push:
    branches: ['perf-ci/**']

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Probe every installed Xcode
        run: |
          set -u
          arch=$(uname -m)
          echo "runner=${{ matrix.os }} arch=$arch macos=$(sw_vers -productVersion)"
          ls -d /Applications/Xcode*.app
          count() {  # $1 = object file
            xcrun objdump -d --no-show-raw-insn "$1" 2>/dev/null | awk '
              /^[0-9a-f]+ <.*>:$/ { p = ($0 ~ /<_+PyEval_EvalFrameDefault(\.[a-z0-9.]+)?>:/) ; next }
              p' | grep -cE $'\t(br|jmpq?)\t[^0-9#]*(x[0-9]+|\\*)' || true
          }
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] && continue
            export DEVELOPER_DIR="$x/Contents/Developer"
            sudo xcodebuild -license accept > /dev/null 2>&1 || true
            sudo DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch > /dev/null 2>&1 || true
            cc_ver=$(xcrun clang --version 2>/dev/null | head -1) || continue
            b="$RUNNER_TEMP/b-$(basename "$x" .app)"
            mkdir -p "$b" && cd "$b"
            if ! "$GITHUB_WORKSPACE/configure" CC=clang > configure.log 2>&1; then
              echo "RESULT xcode=$(basename "$x") clang='$cc_ver' configure-failed"
              [ -n "${cfgshown:-}" ] || { grep -B2 -A12 'checking whether the C compiler works' config.log | head -40; cfgshown=1; }
              cd - > /dev/null; continue
            fi
            cmd=$(make -n Python/ceval.o 2>/dev/null | grep -E ' -c .*ceval\.c' | tail -1)
            eval "$cmd" > build.log 2>&1 && n0=$(count Python/ceval.o) || n0=build-failed
            t0=$(xcrun objdump -d --no-show-raw-insn Python/ceval.o | grep -cE $'\t(br|jmpq?)\t[^0-9#]*(x[0-9]+|\\*)' || true)
            [ -n "${shown:-}" ] || { xcrun objdump -d --no-show-raw-insn Python/ceval.o | grep -m3 -i 'EvalFrameDefault' ; shown=1; }
            eval "$cmd -mllvm -tail-dup-pred-size=1000" >> build.log 2>&1 && n1=$(count Python/ceval.o) || n1=build-failed
            t1=$(xcrun objdump -d --no-show-raw-insn Python/ceval.o | grep -cE $'\t(br|jmpq?)\t[^0-9#]*(x[0-9]+|\\*)' || true)
            opt=$(echo "$cmd" | grep -oE ' -O[0-3s]' | tail -1)
            echo "RESULT runner=${{ matrix.os }} arch=$arch xcode=$(basename "$x") clang='$cc_ver' opt=$opt dispatch_default=$n0 dispatch_taildup_fix=$n1 whole_object_default=$t0 whole_object_fix=$t1"
            cd - > /dev/null
          done
