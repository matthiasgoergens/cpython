# Randomized-block performance comparison of CPython builds on GitHub runners.
#
# Installed as the *only* workflow on throwaway `perf-ci/*` branches by
# perf-notes/ci/make_branch.sh.  Configuration lives in perf-notes/ci/config.json
# on the branch.  Every matrix job is one or more complete blocks: it builds
# all arms on the same runner and then runs every (benchmark, arm) cell in a
# fresh random order, so runner-to-runner and time-varying nuisance is shared
# within a block and cancels in the paired analysis.
name: perf-block

on:
  push:
    branches: ['perf-ci/**']

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.cfg.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: perf-notes
      - id: cfg
        run: |
          n=$(python3 -c 'import json;print(json.load(open("perf-notes/ci/config.json"))["jobs"])')
          echo "jobs=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  block:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: ci
      - name: Install build dependencies
        run: sudo bash ci/.github/workflows/posix-deps-apt.sh
      - name: Machine info
        run: |
          nproc; lscpu | grep -E 'Model name|MHz|L3'; free -g
      - name: Build arms
        run: |
          set -eux
          cfg=ci/perf-notes/ci/config.json
          configure_args=$(python3 -c "import json;print(json.load(open('$cfg')).get('configure','--enable-optimizations --with-lto'))")
          for arm in $(python3 -c "import json;print(' '.join(json.load(open('$cfg'))['arms']))"); do
            ref=$(python3 -c "import json;print(json.load(open('$cfg'))['arms']['$arm'])")
            git -C ci fetch -q --depth=1 origin "$ref"
            git -C ci worktree add -q --detach "$HOME/src-$arm" FETCH_HEAD
            mkdir -p "$HOME/b-$arm"
            (cd "$HOME/b-$arm" && "$HOME/src-$arm/configure" $configure_args > configure.log 2>&1 && make -j"$(nproc)" > make.log 2>&1) \
              || { tail -50 "$HOME/b-$arm/make.log" "$HOME/b-$arm/configure.log"; exit 1; }
            "$HOME/b-$arm/python" -c 'import sys; print(sys.version)'
          done
          # Build determinism evidence: whole binary and .text section hashes per arm.
          for arm in $(python3 -c "import json;print(' '.join(json.load(open('$cfg'))['arms']))"); do
            objcopy -O binary --only-section=.text "$HOME/b-$arm/python" "$HOME/text-$arm.bin"
            echo "HASH $arm binary=$(sha256sum < "$HOME/b-$arm/python" | cut -c1-16) text=$(sha256sum < "$HOME/text-$arm.bin" | cut -c1-16)"
          done
          # Optional same-binary control arm: "<name>=same:<arm>" is a symlink to that arm's build.
          for pair in $(python3 -c "import json;print(' '.join(f'{k}={v}' for k,v in json.load(open('$cfg')).get('same_binary', {}).items()))"); do
            ln -s "$HOME/b-${pair#*=}" "$HOME/b-${pair%%=*}"
          done
      - name: Install pyperf / pyperformance
        run: |
          python3 -m venv "$HOME/drv"
          "$HOME/drv/bin/pip" install -q pyperf pyperformance
          "$HOME/drv/bin/pip" install -q --no-deps --target "$HOME/pyperf-lib" pyperf
      - name: Run blocks
        env:
          PERF_PYPERF_LIB: /home/runner/pyperf-lib
        run: |
          set -eux
          cfg=ci/perf-notes/ci/config.json
          args=$(python3 - <<EOF
          import json, os
          c = json.load(open("$cfg"))
          home = os.environ["HOME"]
          a = [f"--arm {k}={home}/b-{k}/python" for k in list(c["arms"]) + list(c.get("same_binary", {}))]
          a += ["--blocks", str(c.get("blocks_per_job", 1)), "--values", str(c.get("values", 3)),
                "--scale", str(c.get("scale", 1.0))]
          if c.get("bench"):
              a += ["--bench", "'" + c["bench"] + "'"]
          print(" ".join(a))
          EOF
          )
          eval "$HOME/drv/bin/python" ci/perf-notes/tools/blockbench.py run $args \
            --loops ci/perf-notes/ci/loops.json \
            --tag "${GITHUB_RUN_ID}-${{ matrix.job }}" --seed "${GITHUB_RUN_ID}${{ matrix.job }}" \
            --out "$HOME/results.jsonl"
      - name: Report
        if: always()
        run: |
          "$HOME/drv/bin/python" ci/perf-notes/tools/blockbench.py analyze "$HOME/results.jsonl" --base "$(python3 -c "import json;print(next(iter(json.load(open('ci/perf-notes/ci/config.json'))['arms'])))")" || true
          echo "=====BEGIN-RESULTS-B64====="
          gzip -9c "$HOME/results.jsonl" | base64 -w 0; echo
          echo "=====END-RESULTS-B64====="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.job }}
          path: ~/results.jsonl
